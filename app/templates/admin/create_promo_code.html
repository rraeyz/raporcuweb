{% extends "base.html" %}

{% block title %}Yeni Promosyon Kodu - Admin - {{ super() }}{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-plus"></i> Yeni Promosyon Kodu</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.create_promo_code') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="code" class="form-label">Kod</label>
                            <input type="text" class="form-control" id="code" name="code" 
                                   placeholder="Boş bırakırsanız otomatik oluşturulur">
                            <div class="form-text">Örn: YILBASI2025</div>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Açıklama</label>
                            <input type="text" class="form-control" id="description" name="description">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="discount_type" class="form-label">İndirim Tipi *</label>
                                <select class="form-select" id="discount_type" name="discount_type" required>
                                    <option value="percentage">Yüzde (%)</option>
                                    <option value="fixed">Sabit Tutar (TL)</option>
                                    <option value="bonus_credits">Bonus Kredi</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="discount_value" class="form-label">İndirim Değeri *</label>
                                <input type="number" step="0.01" class="form-control" id="discount_value" 
                                       name="discount_value" min="0" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="max_uses" class="form-label">Toplam Kullanım Limiti</label>
                                <input type="number" class="form-control" id="max_uses" name="max_uses" 
                                       placeholder="Boş = Sınırsız">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="max_uses_per_user" class="form-label">Kullanıcı Başına Limit</label>
                                <input type="number" class="form-control" id="max_uses_per_user" 
                                       name="max_uses_per_user" value="1">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="min_purchase_amount" class="form-label">Minimum Alışveriş (TL)</label>
                                <input type="number" step="0.01" class="form-control" id="min_purchase_amount" 
                                       name="min_purchase_amount" value="0">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="valid_until" class="form-label">Son Geçerlilik Tarihi</label>
                                <input type="date" class="form-control" id="valid_until" name="valid_until">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" checked>
                                <label class="form-check-label" for="is_active">Aktif</label>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Kodu Oluştur
                            </button>
                            <a href="{{ url_for('admin.promo_codes') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Geri Dön
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
