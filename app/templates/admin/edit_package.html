{% extends "base.html" %}

{% block title %}Paket Düzenle - Admin - {{ super() }}{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-edit"></i> Paketi Düzenle</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.edit_package', package_id=package.id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label for="name" class="form-label">Paket Adı *</label>
                            <input type="text" class="form-control" id="name" name="name" value="{{ package.name }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="description" class="form-label">Açıklama</label>
                            <textarea class="form-control" id="description" name="description" rows="2">{{ package.description }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="credits" class="form-label">Kredi *</label>
                                <input type="number" class="form-control" id="credits" name="credits" value="{{ package.credits }}" min="1" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="price" class="form-label">Fiyat (TL) *</label>
                                <input type="number" step="0.01" class="form-control" id="price" name="price" value="{{ package.price }}" min="0" required>
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="badge" class="form-label">Badge (Opsiyonel)</label>
                                <input type="text" class="form-control" id="badge" name="badge" value="{{ package.badge }}" placeholder="En Popüler">
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="sort_order" class="form-label">Sıralama</label>
                                <input type="number" class="form-control" id="sort_order" name="sort_order" value="{{ package.sort_order }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" 
                                       {% if package.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">Aktif</label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_featured" name="is_featured" 
                                       {% if package.is_featured %}checked{% endif %}>
                                <label class="form-check-label" for="is_featured">Öne Çıkan</label>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Değişiklikleri Kaydet
                            </button>
                            <a href="{{ url_for('admin.packages') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Geri Dön
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
