{% extends "base.html" %}

{% block title %}Kullanıcı Düzenle - Admin - {{ super() }}{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card shadow">
                <div class="card-header bg-white">
                    <h4 class="mb-0"><i class="fas fa-user-edit"></i> Kullanıcı Düzenle</h4>
                </div>
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('admin.edit_user', user_id=user.id) }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
                        <div class="mb-3">
                            <label class="form-label">Kullanıcı Adı</label>
                            <input type="text" class="form-control" value="{{ user.username }}" disabled>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">E-posta</label>
                            <input type="email" class="form-control" value="{{ user.email }}" disabled>
                        </div>
                        
                        <div class="mb-3">
                            <label for="full_name" class="form-label">Tam Ad</label>
                            <input type="text" class="form-control" id="full_name" name="full_name" 
                                   value="{{ user.full_name }}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="credits" class="form-label">Kredi</label>
                            <input type="number" class="form-control" id="credits" name="credits" 
                                   value="{{ user.credits }}" min="0">
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_active" name="is_active" 
                                       {% if user.is_active %}checked{% endif %}>
                                <label class="form-check-label" for="is_active">Aktif</label>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="is_admin" name="is_admin" 
                                       {% if user.is_admin %}checked{% endif %}>
                                <label class="form-check-label" for="is_admin">Admin</label>
                            </div>
                        </div>
                        
                        <hr>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <small class="text-muted">Kayıt Tarihi</small>
                                <p>{{ user.created_at|datetime }}</p>
                            </div>
                            <div class="col-md-6">
                                <small class="text-muted">Son Giriş</small>
                                <p>{{ user.last_login|datetime if user.last_login else 'Hiç giriş yapmadı' }}</p>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">
                                <i class="fas fa-save"></i> Kaydet
                            </button>
                            <a href="{{ url_for('admin.users') }}" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Geri Dön
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
