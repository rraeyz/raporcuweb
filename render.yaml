services:
  - type: web
    name: raporcuweb
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && bash build.sh
    startCommand: gunicorn run:app --workers 1 --threads 2 --timeout 120 --max-requests 100 --max-requests-jitter 10
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: raporcuweb-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: raporcuweb-db
    region: frankfurt
    plan: free
    databaseName: raporcuweb
    user: raporcuweb
