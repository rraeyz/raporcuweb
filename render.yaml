services:
  - type: web
    name: raporcuweb
    env: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: FLASK_APP
        value: run.py
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: raporcuweb-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: raporcuweb-db
    region: frankfurt
    plan: free
    databaseName: raporcuweb
    user: raporcuweb
